<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - zSolution</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <h2>Login to zSolution</h2>

    <form id="loginForm" novalidate>
      <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" />
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" />
      <p id="error-message" class="error" aria-live="polite"></p>
      <button type="submit" id="loginBtn">Login</button>
    </form>

    <div class="credentials" aria-hidden="false">
      <strong>Test Login Credentials:</strong>
      <ul>
        <li><b>admin</b> / test123</li>
        <li><b>shuhan</b> / pass123</li>
        <li><b>miraj</b> / hello123</li>
        <li><b>rayhan</b> / ray456</li>
        <li><b>raja</b> / king789</li>
      </ul>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
